<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Biblioteca CINJUDESCO</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
}

header {
    background: #2c3e50;
    color: white;
    padding: 15px;
    text-align: center;
}

.container {
    padding: 20px;
}

#buscador {
    width: 100%;
    padding: 10px;
    margin-bottom: 20px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

.card {
    background: white;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 10px;
    box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
}

button {
    padding: 8px 12px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.prestar {
    background: #27ae60;
    color: white;
}

.prestar:hover {
    background: #219150;
}
</style>
</head>

<body>

<header>
    <h1>📚 Biblioteca CINJUDESCO</h1>
</header>

<div class="container">

    <!-- 🔍 Buscador -->
    <input 
        type="text" 
        id="buscador" 
        placeholder="Buscar libro por título..." 
        onkeyup="buscar()"
    >

    <!-- 📚 Lista de libros -->
    <div id="libros"></div>

</div>

<script>
const API = "http://localhost:8080/libros/google";

let listaLibros = [];

// 📥 Cargar libros
async function cargarLibros() {
    try {
        const res = await fetch(API);
        listaLibros = await res.json();
        mostrarLibros(listaLibros);
    } catch (error) {
        console.error("Error cargando libros:", error);
    }
}

// 📚 Mostrar libros
function mostrarLibros(libros) {
    const contenedor = document.getElementById("libros");
    contenedor.innerHTML = "";

    if (libros.length === 0) {
        contenedor.innerHTML = "<p>No hay libros disponibles</p>";
        return;
    }

    libros.forEach(libro => {
        contenedor.innerHTML += `
            <div class="card">
                <h3>${libro.titulo}</h3>
                <p>${libro.resumen}</p>
                <button class="prestar" onclick="prestar('${libro.titulo}')">
                    📖 Prestar
                </button>
            </div>
        `;
    });
}

// 🔍 Buscar libros
function buscar() {
    const texto = document.getElementById("buscador").value.toLowerCase();

    const filtrados = listaLibros.filter(libro =>
        libro.titulo.toLowerCase().includes(texto)
    );

    mostrarLibros(filtrados);
}

// 📖 Acción de préstamo (por ahora solo muestra alerta)
function prestar(titulo) {
    alert("Has solicitado el libro: " + titulo);

    // 🔥 Luego aquí conectamos con backend para guardar préstamo
}

// 🚀 Inicializar
cargarLibros();

</script>

</body>
</html>
